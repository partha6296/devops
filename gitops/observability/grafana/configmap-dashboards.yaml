apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability-stack
data:
  microservices-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "title": "TaskApp - Microservices Overview",
      "tags": ["taskapp", "microservices", "production"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Total Request Rate (All Services)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate({__name__=~\"(user|task|notification)_service_http_requests_total\"}[1m])) or vector(0)",
              "legendFormat": "Requests/sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "mappings": []
            }
          }
        },
        {
          "id": 2,
          "title": "5xx Server Error Rate (%)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "(sum(rate({__name__=~\"(user|task|notification)_service_http_requests_total\", status_code=~\"5..\"}[1m])) / sum(rate({__name__=~\"(user|task|notification)_service_http_requests_total\"}[1m])) * 100) or vector(0)",
              "legendFormat": "Error %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Active Microservice Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "count(count by (pod) (container_cpu_usage_seconds_total{namespace=\"taskapp-dev\", container!=\"\"})) or vector(0)",
              "legendFormat": "Pods",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "none"
            }
          }
        },
        {
          "id": 4,
          "title": "Frontend Ingress Gateway Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "count(count by (pod) (container_cpu_usage_seconds_total{namespace=\"taskapp-dev\", pod=~\"frontend.*\", container!=\"\"})) or vector(0)",
              "legendFormat": "Frontend Pods",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "none"
            }
          }
        },
        {
          "id": 5,
          "title": "HTTP Traffic Rate per Service (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum by (job, __name__) (rate({__name__=~\"(user|task|notification)_service_http_requests_total\"}[1m]))",
              "legendFormat": "{{__name__}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15
              },
              "unit": "reqps"
            }
          }
        },
        {
          "id": 6,
          "title": "HTTP Status Codes Distribution",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum by (status_code) (rate({__name__=~\"(user|task|notification)_service_http_requests_total\"}[1m]))",
              "legendFormat": "HTTP {{status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "stacking": { "mode": "normal" }
              },
              "unit": "reqps"
            }
          }
        },
        {
          "id": 7,
          "title": "Live Application Logs (Streaming from Loki)",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 12 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "{namespace=\"taskapp-dev\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }

  cluster-resources.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "title": "TaskApp - Cluster Resources & Health",
      "tags": ["kubernetes", "infrastructure", "cluster"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[2m])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 10 },
              "unit": "core"
            }
          }
        },
        {
          "id": 2,
          "title": "Memory Usage (Working Set) by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(container_memory_working_set_bytes{container!=\"\"}) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 10 },
              "unit": "bytes"
            }
          }
        },
        {
          "id": 3,
          "title": "Microservices CPU Usage (taskapp-dev)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"taskapp-dev\", container!=\"\"}[2m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "core" }
          }
        },
        {
          "id": 4,
          "title": "Microservices Memory Usage (taskapp-dev)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"taskapp-dev\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          }
        }
      ]
    }
